name: Generate manifest

on:
  push:
    branches: [main]
    paths-ignore: ['manifest.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for per-file modified dates
      - run: python3 .github/scripts/generate_manifest.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update manifest.json [skip ci]"
          file_pattern: manifest.json
